name: 从 cfnew 同步 Releases

on:
  workflow_dispatch:
  schedule:
    - cron: '0 */6 * * *'

permissions:
  contents: write

jobs:
  sync-release:
    runs-on: ubuntu-latest
    env:
      GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
    steps:
      - name: 检出仓库
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: 获取 cfnew 最新发布
        id: get_latest
        run: |
          set -e
          JSON=$(curl -fsSL \
            -H "Authorization: Bearer $GH_TOKEN" \
            -H "Accept: application/vnd.github+json" \
            https://api.github.com/repos/byJoey/cfnew/releases/latest)
          VERSION=$(echo "$JSON" | jq -r '.tag_name')
          URL=$(echo "$JSON" | jq -r '.assets[] | select(.name=="Pages.zip") | .browser_download_url' | head -1)
          if [ -z "$VERSION" ] || [ "$VERSION" = "null" ] || [ -z "$URL" ]; then
            echo "错误：未拿到版本或 Pages.zip"
            echo "$JSON" | head -c 500
            exit 1
          fi
          echo "version=$VERSION" >> $GITHUB_OUTPUT
          echo "download_url=$URL" >> $GITHUB_OUTPUT
          echo "最新版本: $VERSION"

      - name: 检查当前版本
        id: check_version
        run: |
          CURRENT=$(cat VERSION.txt 2>/dev/null | tr -d '\n\r ' || true)
          NEW="${{ steps.get_latest.outputs.version }}"
          echo "current_version=$CURRENT" >> $GITHUB_OUTPUT
          if [ "$CURRENT" != "$NEW" ]; then
            echo "need_update=true" >> $GITHUB_OUTPUT
            echo "需要更新: '$CURRENT' -> '$NEW'"
          else
            echo "need_update=false" >> $GITHUB_OUTPUT
            echo "版本相同，无需更新"
          fi

      - name: 下载并更新文件
        if: steps.check_version.outputs.need_update == 'true'
        run: |
          set -e
          curl -fL -o Pages.zip "${{ steps.get_latest.outputs.download_url }}"
          unzip -o Pages.zip -d .
          rm -f Pages.zip
          echo "${{ steps.get_latest.outputs.version }}" > VERSION.txt

      - name: 提交并推送更改
        if: steps.check_version.outputs.need_update == 'true'
        run: |
          git config --local user.email "action@github.com"
          git config --local user.name "GitHub Action"
          git add -A
          if git diff --staged --quiet; then
            echo "没有变更需要提交"
          else
            git commit -m "自动同步: 更新到 cfnew ${{ steps.get_latest.outputs.version }}"
            git push
          fi

      - name: 输出摘要
        run: |
          echo "## 同步结果" >> $GITHUB_STEP_SUMMARY
          echo "- 最新版本: ${{ steps.get_latest.outputs.version }}" >> $GITHUB_STEP_SUMMARY
          echo "- 之前版本: ${{ steps.check_version.outputs.current_version }}" >> $GITHUB_STEP_SUMMARY
          echo "- 是否更新: ${{ steps.check_version.outputs.need_update }}" >> $GITHUB_STEP_SUMMARY
